name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (example: v1.2.3)"
        required: true
        type: string
      publish_release:
        description: "Create GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Sync frontend dist to embed directory
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\sync_frontend_dist.ps1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          if ($eventName -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag.StartsWith("v")) {
            throw "Tag must start with 'v'. Current: $tag"
          }
          "tag_name=$tag" >> $env:GITHUB_OUTPUT

      - name: Build binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -tags=jsoniter -ldflags "-s -w" -o dist/lol-shield-v2.exe cmd/shield-v2/main.go
          go build -tags=jsoniter -ldflags "-s -w" -o dist/lcu-info.exe cmd/token/main.go

          Copy-Item -Force config.yaml dist/config.yaml

      - name: Package zip
        id: pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $tag = "${{ steps.meta.outputs.tag_name }}"
          $zipName = "lol-shield_${tag}_windows_amd64_v2.zip"
          $zipPath = Join-Path (Resolve-Path .\release) $zipName
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path dist\* -DestinationPath $zipPath
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ steps.meta.outputs.tag_name }}
          path: ${{ steps.pack.outputs.zip_path }}

      - name: Create GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.tag_name }}
          generate_release_notes: true
          files: ${{ steps.pack.outputs.zip_path }}
