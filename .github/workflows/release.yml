name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows Tauri bundle
    runs-on: windows-latest
    env:
      CI: true
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Apply release version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = if ($tag.StartsWith("v")) { $tag.Substring(1) } else { $tag }
          Write-Host "Using release version $version from tag $tag"

          $tauriConfigPath = Join-Path $PWD "src-tauri/tauri.conf.json"
          $tauriConfig = Get-Content -Raw $tauriConfigPath | ConvertFrom-Json
          $tauriConfig.version = $version

          $hasUpdaterKey = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)
          $tauriConfig.bundle | Add-Member -MemberType NoteProperty -Name "createUpdaterArtifacts" -Value $hasUpdaterKey -Force
          if ($hasUpdaterKey) {
            Write-Host "已配置更新签名密钥，将生成 updater 产物与更新清单"
          } else {
            Write-Host "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY，跳过 updater 产物与更新清单，应用不会提示新版本"
          }

          $tauriConfig | ConvertTo-Json -Depth 100 | Set-Content $tauriConfigPath

          $cargoTomlPath = Join-Path $PWD "src-tauri/Cargo.toml"
          $updated = $false
          $cargoToml = Get-Content $cargoTomlPath | ForEach-Object {
            if (-not $updated -and $_ -match '^version = "') {
              $updated = $true
              "version = `"$version`""
            } else {
              $_
            }
          }
          if (-not $updated) {
            throw "Failed to update src-tauri/Cargo.toml version"
          }
          Set-Content $cargoTomlPath $cargoToml

      - name: Build Go sidecar
        shell: pwsh
        run: ./scripts/build-tauri-sidecar.ps1

      - name: Build Tauri NSIS bundle
        run: pnpm --dir frontend tauri:build

      - name: Generate checksums
        shell: pwsh
        run: |
          $bundleDir = Join-Path $PWD "src-tauri/target/release/bundle/nsis"
          Get-ChildItem -Path $bundleDir -File -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -NoNewline -Value "$hash *$($_.Name)"
          }

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sha256

      - name: Generate updater manifest
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = if ($tag.StartsWith("v")) { $tag.Substring(1) } else { $tag }
          $repo = "${{ github.repository }}"
          $headers = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            Accept                 = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          # GitHub 会规范化上传的文件名（如空格替换为点号），本地构建产物名与线上资产名可能不一致；
          # 因此必须在 Publish release 之后、以线上资产的实际 browser_download_url 为准。
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "*-setup.exe" } | Select-Object -First 1
          if (-not $asset) {
            $found = ($release.assets | Select-Object -ExpandProperty name) -join ", "
            throw "发布资产中未找到 NSIS 安装包（现有：$found）"
          }

          $bundleDir = Join-Path $PWD "src-tauri/target/release/bundle/nsis"
          # createUpdaterArtifacts=true（v2 格式）下，Windows 更新包就是 NSIS 安装包本身及其 .sig 签名。
          $signature = Get-ChildItem -Path $bundleDir -File -Filter "*-setup.exe.sig" | Select-Object -First 1
          if (-not $signature) { throw "缺少更新包签名文件（$bundleDir）" }

          # 校验下载地址真实可用（重定向到 release-assets 后应为 200），避免清单写入死链。
          $probe = Invoke-WebRequest -Uri $asset.browser_download_url -Method Head -ErrorAction Stop
          if ($probe.StatusCode -ne 200) { throw "更新包下载地址不可用：$($asset.browser_download_url)（HTTP $($probe.StatusCode)）" }

          $manifest = [ordered]@{
            version   = $version
            notes     = "更新说明见 https://github.com/$repo/releases/tag/$tag"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content -Raw $signature.FullName).Trim()
                url       = $asset.browser_download_url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $PWD "latest.json")
          Write-Host "已生成 latest.json，指向 $($asset.name)"

      - name: Remove previous updater manifest
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $headers = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            Accept                 = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/updater" -Headers $headers
          } catch {
            $release = $null
          }
          if ($release) {
            foreach ($asset in $release.assets) {
              if ($asset.name -eq "latest.json") {
                Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$repo/releases/assets/$($asset.id)" -Headers $headers
                Write-Host "已删除旧的 latest.json"
              }
            }
          }

      - name: Publish updater manifest
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: updater
          name: updater
          body: 由发布工作流自动维护的更新清单，请勿手动修改。
          prerelease: true
          fail_on_unmatched_files: true
          files: latest.json
