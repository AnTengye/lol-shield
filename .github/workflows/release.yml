name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows Tauri bundle
    runs-on: windows-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Apply release version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = if ($tag.StartsWith("v")) { $tag.Substring(1) } else { $tag }
          Write-Host "Using release version $version from tag $tag"

          $tauriConfigPath = Join-Path $PWD "src-tauri/tauri.conf.json"
          $tauriConfig = Get-Content -Raw $tauriConfigPath | ConvertFrom-Json
          $tauriConfig.version = $version
          $tauriConfig | ConvertTo-Json -Depth 100 | Set-Content $tauriConfigPath

          $cargoTomlPath = Join-Path $PWD "src-tauri/Cargo.toml"
          $updated = $false
          $cargoToml = Get-Content $cargoTomlPath | ForEach-Object {
            if (-not $updated -and $_ -match '^version = "') {
              $updated = $true
              "version = `"$version`""
            } else {
              $_
            }
          }
          if (-not $updated) {
            throw "Failed to update src-tauri/Cargo.toml version"
          }
          Set-Content $cargoTomlPath $cargoToml

      - name: Build Go sidecar
        shell: pwsh
        run: ./scripts/build-tauri-sidecar.ps1

      - name: Build Tauri NSIS bundle
        run: pnpm --dir frontend tauri:build

      - name: Generate checksums
        shell: pwsh
        run: |
          $bundleDir = Join-Path $PWD "src-tauri/target/release/bundle/nsis"
          Get-ChildItem -Path $bundleDir -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -NoNewline -Value "$hash *$($_.Name)"
          }

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
