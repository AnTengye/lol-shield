name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Sync frontend dist
        run: |
          rm -rf internal/client/web/dist
          mkdir -p internal/client/web/dist
          cp -R frontend/dist/. internal/client/web/dist/

      - name: Build Windows binary
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build \
            -tags jsoniter \
            -ldflags "-s -w" \
            -o dist/lol-shield-windows-amd64.exe \
            ./cmd/shield/main.go

      - name: Generate checksum
        run: |
          cd dist
          sha256sum lol-shield-windows-amd64.exe > lol-shield-windows-amd64.exe.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/lol-shield-windows-amd64.exe
            dist/lol-shield-windows-amd64.exe.sha256
