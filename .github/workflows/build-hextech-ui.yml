name: Build enlarged Hextech icons

on:
  push:
    branches: [fix/hextech-augment-icons]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Build frontend and sidecar
        shell: pwsh
        run: |
          pnpm --dir frontend install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency install failed' }
          pnpm --dir frontend build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          ./scripts/build-tauri-sidecar.ps1
      - name: Build desktop executable
        shell: pwsh
        run: |
          $version = '2.0.0-rc.17'
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath
          $cargo = Get-Content -Raw 'src-tauri/Cargo.toml'
          $cargo = [regex]::Replace($cargo, '(?m)^version = "[^"]+"', "version = `"$version`"", 1)
          Set-Content 'src-tauri/Cargo.toml' $cargo
          $override = Join-Path $env:RUNNER_TEMP 'lol-shield-ui-build.json'
          '{"build":{"beforeBuildCommand":""}}' | Set-Content $override
          & ./frontend/node_modules/.bin/tauri.cmd build --no-bundle --config $override
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
          $exe = 'src-tauri/target/release/lol-shield-tauri.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "$hash *lol-shield-tauri.exe" | Set-Content "$exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: lol-shield-hextech-icons-windows
          path: |
            src-tauri/target/release/lol-shield-tauri.exe
            src-tauri/target/release/lol-shield-tauri.exe.sha256
          if-no-files-found: error
          retention-days: 7
